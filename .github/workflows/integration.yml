name: Integration Tests

# Runs the live integration suite (tests/integration, marked `integration`)
# against the shared Monday.com TEST board on every pull request.
#
# Gated on the MONDAY_API_TOKEN repository secret:
#   - Forked PRs (which cannot access secrets) are filtered out by the job `if`
#     and never fail.
#   - Same-repo PRs / manual runs where the secret is unset skip cleanly (exit 0)
#     via the "Secret gate" step below.
#
# Runs are serialized through a single concurrency group so overlapping PRs queue
# instead of colliding on the shared board or tripping the 60 calls/min limit.
#
# This workflow is independent of `tests.yml` (unit tests) and `release.yml`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # Serialize ALL integration runs against the shared test board.
  # Do NOT cancel in-progress runs — a cancelled run could leave residual
  # artifacts on the board; let runs queue instead.
  group: monday-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Integration tests (live Monday.com test board)
    runs-on: ubuntu-latest
    # Skip forked PRs — they have no access to the MONDAY_API_TOKEN secret.
    # Allow same-repo pull requests and manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Secret gate (skip cleanly if token absent)
        id: gate
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          if [ -z "$MONDAY_API_TOKEN" ]; then
            echo "::notice::MONDAY_API_TOKEN secret is not configured — skipping integration tests (no failure)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration suite
        if: steps.gate.outputs.run == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          # Defaults to the dedicated scratch test board. Override with a repo
          # variable if a different board must be used; the harness hard-fails
          # if this ever resolves to the project-management board 18422673287.
          MONDAY_TEST_BOARD_ID: ${{ vars.MONDAY_TEST_BOARD_ID || '18422673411' }}
        run: pytest tests/integration -m integration
