name: Build and Release Binary

# Triggered by the annotated tag pushed by semantic-release.yml (v*.*.*).
#
# Ownership boundary (FR-0003 US-0003-05, Option A):
#  - semantic-release.yml owns: version bump, CHANGELOG update, git tag, and the
#    GitHub Release object (created by python-semantic-release via upload_to_release).
#  - This workflow owns: building the Linux binary, verifying it, and uploading
#    the binary assets to the already-created GitHub Release.
#
# Release notes source: python-semantic-release generates the notes from
# Conventional Commits and attaches them to the Release it creates.
# The old CHANGELOG.md awk/grep extraction has been removed in favour of
# auto-generated notes (see semantic-release.yml and [tool.semantic_release] in
# pyproject.toml).
#
# Version propagation: pip install -e . re-reads the (already bumped) version
# from pyproject.toml, so --copy-metadata=monday-cli embeds the correct version
# in the binary. The "Test binary" step asserts `monday version` prints it.
#
# Python version note: pinned to 3.13 here (matching prior release.yml) even
# though pyproject.toml targets >=3.11. The binary is produced from 3.13 to
# maximise forward compatibility. Flag for team standardisation if needed.
#
# Concurrency: one build per tag. A tag is immutable so cancel-in-progress is
# safe (the same tag cannot be pushed twice).

on:
  push:
    tags:
      - 'v*.*.*'  # Triggered by the annotated tag from semantic-release.yml
  workflow_dispatch:  # Manual trigger for testing / emergency releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Required for uploading release assets

jobs:
  build-and-attach:
    name: Build Linux Binary and Attach to Release
    runs-on: ubuntu-latest

    steps:
      # Wait for PSR to finish creating the GitHub Release before we try to
      # upload assets to it. PSR creates the Release AFTER pushing the tag, so
      # there is a brief window where the tag exists but the Release does not.
      # If we attempt upload before the Release exists, softprops/action-gh-release
      # will create a second Release — breaking the single-release guarantee.
      #
      # Window sizing: both workflows trigger off the same tag push, so this wait
      # races semantic-release.yml's "release" job, which only creates the Release
      # AFTER its "test" job (checkout + Python setup + `pip install -e ".[dev]"`)
      # completes, then does a second `pip install -e ".[dev]"` of its own before
      # reaching the `gh release create` step. That worst case (two dependency
      # installs + a full unit-test run on a cold runner) can exceed 5 minutes, so
      # the wait window here must comfortably exceed it. Keep this window >=
      # semantic-release.yml's worst-case test+install+release time; if that job
      # grows, widen this loop to match.
      # We poll the GitHub API for up to ~15 minutes before proceeding.
      - name: Wait for GitHub Release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          echo "Waiting for GitHub Release for tag $TAG ..."
          for i in $(seq 1 90); do
            STATUS=$(gh release view "$TAG" --repo "$REPO" 2>&1 && echo "found" || echo "not_found")
            if echo "$STATUS" | grep -q "found"; then
              echo "✓ Release found after ${i}x10s = $((i*10))s"
              break
            fi
            echo "  attempt $i/90 — release not yet available, retrying in 10s..."
            sleep 10
          done
          # Final check — fail if still not found after ~15 minutes
          gh release view "$TAG" --repo "$REPO" || {
            echo "ERROR: GitHub Release for $TAG was not found after 15 minutes."
            echo "PSR may have encountered an error creating the Release."
            exit 1
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Check out the tagged commit so pyproject.toml has the bumped version
          ref: ${{ github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install package
        # Re-installing after the version bump ensures --copy-metadata=monday-cli
        # embeds the released version into the binary at build time.
        run: pip install -e .

      - name: Build binary
        run: python build/build_binary.py

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag to get version (e.g. v0.6.0 → 0.6.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Test binary
        run: |
          chmod +x dist/monday
          dist/monday --help
          dist/monday version
          dist/monday items --help
          dist/monday subitems --help
          dist/monday updates --help
          # Verify the binary reports the released version (proves metadata propagation)
          BINARY_VERSION=$(dist/monday version --json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || dist/monday version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Binary reports version: $BINARY_VERSION"
          echo "Expected version:       ${{ steps.version.outputs.version }}"
          if [ "$BINARY_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: Binary version mismatch! Expected ${{ steps.version.outputs.version }}, got $BINARY_VERSION"
            exit 1
          fi
          echo "✓ Version propagation confirmed"

      # --- --table regression guard (FR-0007 US-0007-02) ---
      #
      # Exercises the frozen dist/monday binary's --table path against a live
      # Monday.com board whose item name contains a non-ASCII character.
      # This is the only way to trigger rich._unicode_data.load() — the call that
      # crashed pre-fix binaries with ModuleNotFoundError.  Pure-ASCII content
      # (--help, version, etc.) stays on Rich's fast path and never triggers it.
      #
      # Gate: skips cleanly (exit 0) when MONDAY_API_TOKEN is absent, following
      # the same pattern as integration.yml's "Secret gate" step.  Residual risk:
      # if the secret is ever unset at release time, a broken binary could ship;
      # the hermetic packaging guard in build_binary.py (_assert_rich_unicode_data_bundled)
      # acts as an always-on backstop that catches accidental removal of the fix.
      #
      # Board safety: uses MONDAY_TEST_BOARD_ID (default 18422673411 — the scratch
      # test board).  Hard-fails if it ever resolves to the PM board 18422673287.
      # Every item created here is torn down in the cleanup step, even on failure.

      - name: Table guard — secret gate
        id: table-gate
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          if [ -z "$MONDAY_API_TOKEN" ]; then
            echo "::notice::MONDAY_API_TOKEN secret not configured — skipping --table regression guard (no failure)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Table guard — create non-ASCII item
        id: table-item
        if: steps.table-gate.outputs.run == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_TEST_BOARD_ID: ${{ vars.MONDAY_TEST_BOARD_ID || '18422673411' }}
        run: |
          # Board safety: refuse to run against the PM board
          if [ "$MONDAY_TEST_BOARD_ID" = "18422673287" ]; then
            echo "ERROR: MONDAY_TEST_BOARD_ID resolves to the PM board (18422673287). Refusing to run."
            exit 1
          fi
          # Create a throwaway item whose name contains non-ASCII chars.
          # This deterministically triggers rich._unicode_data.load() when Rich
          # lays out the table, which is the exact call that crashed pre-fix binaries.
          # items create always emits a success line before the JSON blob, so we
          # extract the JSON by locating the first '{' in the mixed output.
          ITEM_OUTPUT=$(dist/monday items create \
            --board-id "$MONDAY_TEST_BOARD_ID" \
            --name "pyinstaller-table-guard ✓ café" 2>&1)
          echo "create output: $ITEM_OUTPUT"
          ITEM_ID=$(echo "$ITEM_OUTPUT" | python3 -c "import sys,json,re; t=sys.stdin.read(); m=re.search(r'\{.*\}', t, re.S); print((json.loads(m.group(0)).get('id','')) if m else '')" 2>/dev/null || true)
          if [ -z "$ITEM_ID" ]; then
            echo "ERROR: Failed to create test item — cannot run table guard."
            echo "Raw output: $ITEM_JSON"
            exit 1
          fi
          echo "item-id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "board-id=$MONDAY_TEST_BOARD_ID" >> "$GITHUB_OUTPUT"
          echo "Created test item $ITEM_ID on board $MONDAY_TEST_BOARD_ID"

      - name: Table guard — render --table and assert no crash
        if: steps.table-gate.outputs.run == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          BOARD_ID="${{ steps.table-item.outputs.board-id }}"
          echo "Running: dist/monday items list --board-id $BOARD_ID --table"
          TABLE_OUTPUT=$(dist/monday items list --board-id "$BOARD_ID" --table 2>&1)
          EXIT_CODE=$?
          echo "$TABLE_OUTPUT"
          # Assert: exit 0, no Python traceback, no ModuleNotFoundError
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: dist/monday items list --table exited with code $EXIT_CODE"
            exit 1
          fi
          if echo "$TABLE_OUTPUT" | grep -q "ModuleNotFoundError"; then
            echo "ERROR: --table output contains ModuleNotFoundError — rich._unicode_data modules not bundled."
            exit 1
          fi
          if echo "$TABLE_OUTPUT" | grep -q "Traceback"; then
            echo "ERROR: --table output contains a Python traceback."
            exit 1
          fi
          # Assert table box-drawing is present (Rich rendered a table, not raw JSON)
          if ! echo "$TABLE_OUTPUT" | grep -qP "[─│┌┐└┘├┤┬┴┼]"; then
            echo "WARNING: Table box-drawing characters not found — Rich may not have rendered a table."
          fi
          echo "Table guard PASSED: exit 0, no traceback, no ModuleNotFoundError."

      - name: Table guard — cleanup (always runs)
        if: always() && steps.table-gate.outputs.run == 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          ITEM_ID="${{ steps.table-item.outputs.item-id }}"
          if [ -n "$ITEM_ID" ]; then
            echo "Deleting test item $ITEM_ID..."
            dist/monday items delete --item-id "$ITEM_ID" --force 2>&1 || \
              echo "::warning::Failed to delete test item $ITEM_ID — manual cleanup may be needed."
          fi

      - name: Rename binary with platform suffix
        run: mv dist/monday dist/monday-linux

      - name: Create SHA256 checksum
        run: |
          cd dist
          sha256sum monday-linux > monday-linux.sha256
          cat monday-linux.sha256

      - name: Build installation instructions
        run: |
          cat << 'EOF' > install_notes.md

          ---

          ## Installation

          ### Linux

          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/monday-linux
          chmod +x monday-linux
          sudo mv monday-linux /usr/local/bin/monday
          ```

          Or with curl:

          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/monday-linux -o monday
          chmod +x monday
          sudo mv monday /usr/local/bin/
          ```

          ### Verification

          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/monday-linux.sha256
          sha256sum -c monday-linux.sha256
          ```

          ### Configuration

          ```bash
          export MONDAY_API_TOKEN="your_api_token_here"
          ```

          ### Quick Start

          ```bash
          monday --help
          monday items get --item-id <item_id>
          monday items create --board-id <board_id> --name "Task name"
          ```

          ### Documentation

          - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          - [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          - [Monday.com API Documentation](https://developer.monday.com/api-reference/reference/about-the-api-reference)

          ---

          Generated with [Monday CLI](https://github.com/${{ github.repository }})
          EOF

      - name: Upload binary assets to GitHub Release
        # The GitHub Release was already created by python-semantic-release
        # (semantic-release.yml). We only upload the binary assets here.
        # softprops/action-gh-release will update the existing Release rather
        # than create a new one when the tag already exists.
        uses: softprops/action-gh-release@v2
        with:
          name: Monday CLI v${{ steps.version.outputs.version }}
          # Append install instructions to the auto-generated release notes
          # produced by python-semantic-release. With append_body: true,
          # our install section is appended after the PSR-generated body.
          append_body: true
          body_path: install_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/monday-linux
            dist/monday-linux.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
