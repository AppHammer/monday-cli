name: Semantic Release

# Trigger: only on push to main (i.e., after a PR is merged).
# This is where automated versioning, changelog, tag, and GitHub Release happen.
#
# Design decisions / hazard mitigations documented here:
#
# 1. GATE ON GREEN TESTS
#    The release job requires the "test" job to pass first. The test job re-runs
#    the unit test suite so we never publish a red build. Once FR-0002 integration
#    tests land on main, add integration.yml as an additional gate at the
#    branch-protection level (no workflow change required for that).
#
# 2. BOT-PUSH LOOP PREVENTION (two independent guards)
#    a. paths-ignore on pyproject.toml + CHANGELOG.md prevents this workflow
#       from firing on the bump commit that PSR pushes.
#    b. PSR adds "[skip ci]" to its bump commit message as a second guard in
#       case paths-ignore is bypassed.
#
# 3. TOKEN REQUIREMENTS
#    GH_TOKEN must be a Personal Access Token (classic) or a GitHub App token
#    with Contents: write + pull-requests: read on this repo.
#    The default GITHUB_TOKEN cannot push to a branch-protected main.
#    See README.md section "Release Bot Token Setup" for configuration steps.
#
# 4. NO-OP BEHAVIOR
#    When there are no releasable commits (feat:/fix:/perf:/BREAKING CHANGE:)
#    since the last tag, PSR writes "released=false" to GITHUB_OUTPUT and exits
#    0 with no file/tag/release changes. The workflow reports this cleanly.
#
# 5. CONCURRENCY — cancel-in-progress: FALSE
#    PSR's release sequence (version bump → commit → tag → GitHub Release) is
#    NOT atomic. Cancelling a mid-flight run could leave a bumped pyproject.toml
#    without a tag, or a tag without a GitHub Release. We use
#    cancel-in-progress: false (default) so each run completes before the next
#    one starts. Rapid pushes to main queue up sequentially; the second run will
#    usually no-op (PSR computes no new version from the already-released commit).
#
# 6. SINGLE-RELEASE GUARANTEE
#    PSR creates the GitHub Release object (upload_to_release = true in
#    pyproject.toml). release.yml (triggered by the tag push) only attaches the
#    Linux binary asset to that existing Release using append_body + asset upload.
#    This guarantees exactly one Release per version.
#
# 7. PSR STEP OUTPUTS
#    We use the official python-semantic-release/python-semantic-release GitHub
#    Action (not the bare CLI) so that step outputs (released, version, tag) are
#    correctly written to GITHUB_OUTPUT and are available to downstream steps.
#    The action wraps the CLI and handles output wiring automatically.

on:
  push:
    branches:
      - main
    # Guard against infinite loop: ignore paths that PSR's bump commit touches.
    # PSR also adds "[skip ci]" to its commit message as a second guard.
    paths-ignore:
      - 'pyproject.toml'
      - 'CHANGELOG.md'

concurrency:
  group: semantic-release-${{ github.ref }}
  # IMPORTANT: must be false. PSR's version+commit+tag+release sequence is not
  # atomic — cancelling mid-run can leave the repo in an inconsistent state.
  cancel-in-progress: false

permissions:
  contents: write  # needed to push commits, tags, and create GitHub Releases

jobs:
  # ── Step 1: Run tests before releasing ────────────────────────────────────
  test:
    name: Gate — Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # fetch-depth: 1 (default) is sufficient — the test job only runs pytest

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit

  # ── Step 2: Compute version, bump pyproject.toml, update CHANGELOG, tag ──
  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
      tag: ${{ steps.semrel.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for PSR version computation
          # Use GH_TOKEN so the push to protected main is authorised.
          # The default GITHUB_TOKEN cannot push past branch protection.
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git identity for PSR commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run python-semantic-release
        id: semrel
        # Use the official GitHub Action (not the bare CLI) so that step outputs
        # (released, version, tag) are correctly written to GITHUB_OUTPUT.
        # The action wraps the PSR CLI and handles output wiring automatically.
        uses: python-semantic-release/python-semantic-release@v9
        with:
          # PSR will:
          #  1. Compute the next version from Conventional Commits since last tag
          #  2. If releasable: bump pyproject.toml, update CHANGELOG.md, commit
          #     with "[skip ci]", push annotated tag v{version} to main, create
          #     GitHub Release with auto-generated notes from Conventional Commits
          #  3. If not releasable: write released=false to outputs and exit 0
          github_token: ${{ secrets.GH_TOKEN }}
          # git_committer_name and git_committer_email are set via git config above

      - name: Report release outcome
        run: |
          if [ "${{ steps.semrel.outputs.released }}" = "true" ]; then
            echo "✓ Released version ${{ steps.semrel.outputs.version }} (tag ${{ steps.semrel.outputs.tag }})"
          else
            echo "No releasable commits found — no release was made (no-op)."
          fi
