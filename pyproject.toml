[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monday-cli"
version = "0.7.0"
description = "A CLI tool to interact with Monday.com API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Monday CLI", email = "noreply@example.com"}
]
dependencies = [
    "typer[all]>=0.21.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "ratelimit>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.30.0",
    "black>=24.1.1",
    "ruff>=0.1.15",
    "mypy>=1.8.0",
    "pyinstaller>=6.3.0",
    "python-semantic-release>=9.0.0",
]

[project.scripts]
monday = "monday_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/monday_cli --cov-report=html --cov-report=term"
markers = [
    "integration: live integration tests against the Monday.com API (requires MONDAY_API_TOKEN); select with -m integration",
]

# =============================================================================
# python-semantic-release configuration
#
# FR-0010 — releases are triggered by an explicit `vX.Y.Z` git tag, NOT on merge.
# Under this flow PSR is used as a CHANGELOG generator (`semantic-release changelog`,
# run by semantic-release.yml on the tag) and, locally, for a next-version
# *suggestion* (`semantic-release version --print`). PSR no longer runs its
# `version` command in CI: the maintainer owns the version (bumps [project].version
# and pushes the matching tag), and the GitHub Release object is created explicitly
# against that tag. The keys below stay authoritative for changelog formatting and
# tag/version mapping and are what make the local suggestion + changelog match CI.
#
# Note: `upload_to_release`/`build_command`/`remote` only take effect if the PSR
# `version`/`publish` commands are ever run (e.g. locally); they are inert on the
# CI tag-triggered path, which uses `changelog` + `gh release create`. Kept for
# consistency and for anyone running PSR by hand.
#
# Version source of truth: pyproject.toml [project].version only (maintainer-owned).
# src/monday_cli/__init__.py reads the version via importlib.metadata at runtime
# and in the built binary (PyInstaller --copy-metadata=monday-cli propagates it).
# =============================================================================

[tool.semantic_release]
major_on_zero = false  # 0.x: breaking changes bump the minor (=> 0.6.0), not 1.0.0
# The single source of version truth: project.version in pyproject.toml
version_toml = ["pyproject.toml:project.version"]

# Commit parser: Conventional Commits (Angular-style)
# "conventional" is the current name in PSR >= 9; "angular" is deprecated.
# Mapping: feat → minor, fix/perf → patch, feat!: / BREAKING CHANGE: → major
commit_parser = "conventional"

# Tag format must match the existing release.yml trigger: v*.*.*
tag_format = "v{version}"

# Do not build/upload to PyPI (PyPI publishing is out of scope for FR-0003)
build_command = ""
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.commit_parser_options]
# Explicit bump mapping (mirrors commitlint.config.js type-enum)
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
# Changelog output path
default_templates = { changelog_file = "CHANGELOG.md" }
# Exclude non-user-facing commit types from generated changelog entries
exclude_commit_patterns = [
    "^chore",
    "^ci",
    "^build",
    "^style",
    "^test",
    "^refactor",
]

[tool.semantic_release.branches.main]
# Release from the main branch only. PSR >= 9 uses a branches table instead of
# the deprecated top-level `branch` key.
match = "main"

[tool.semantic_release.remote]
type = "github"
# Use GH_TOKEN secret (not GITHUB_TOKEN) for pushing to protected main.
# The default GITHUB_TOKEN cannot push past branch protection on main.
# See README.md "Release Bot Token Setup" for configuration steps.
token = { env = "GH_TOKEN" }
